<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DVTM: Damn Vulnerable Threat Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F9; --surface:#FFFFFF; --board:#FBFCFE; --grid:#E3E9F0;
  --ink:#1B2A3A; --muted:#556576; --line:#D5DDE6; --line-strong:#AFBDCB;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --accent-soft:#E4EDFA;
  --tb:#C2342C; --good:#2B7A4B; --bad:#C2342C; --warn:#9A620F;
  --s:#7448C0; --t:#B8650F; --r:#5F6E17; --i:#13789A; --d:#B0346A; --e:#8A5526;
  --font:'Public Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --hand:'Architects Daughter', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161E; --surface:#16202A; --board:#131C25; --grid:#1D2934;
    --ink:#E1E8F0; --muted:#9AA9B9; --line:#273543; --line-strong:#3D4E60;
    --accent:#7DA9F3; --accent-ink:#0F161E; --accent-soft:#1B2B42;
    --tb:#F2726B; --good:#64C08A; --bad:#F2726B; --warn:#E2AA4E;
    --s:#B190EC; --t:#EBA35F; --r:#BBC760; --i:#60C3DF; --d:#E880AA; --e:#D7A574;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F161E; --surface:#16202A; --board:#131C25; --grid:#1D2934;
  --ink:#E1E8F0; --muted:#9AA9B9; --line:#273543; --line-strong:#3D4E60;
  --accent:#7DA9F3; --accent-ink:#0F161E; --accent-soft:#1B2B42;
  --tb:#F2726B; --good:#64C08A; --bad:#F2726B; --warn:#E2AA4E;
  --s:#B190EC; --t:#EBA35F; --r:#BBC760; --i:#60C3DF; --d:#E880AA; --e:#D7A574;
  color-scheme: dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px 20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--hand);font-size:27px;font-weight:400;line-height:1}
.brand span{color:var(--muted);font-size:14px}
.level{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}

/* Shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr)}
.side{border-right:1px solid var(--line);padding:14px 12px 24px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 57px);align-self:start;max-height:calc(100vh - 57px);overflow:auto}
.side h2{font-size:13px;color:var(--muted);font-weight:600;margin:18px 10px 6px}
.side h2:first-child{margin-top:4px}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:15px}
.side a:hover{background:var(--accent-soft)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .meta{font-size:12px;color:var(--muted);font-weight:400}
main{padding:28px 36px 72px;min-width:0;outline:none}
.wrap{max-width:1200px}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--surface)}
  .side h2{display:none}
  .side a{white-space:nowrap}
  .side .meta{display:none}
  main{padding:22px 16px 56px}
  .level{margin-left:0;width:100%;justify-content:space-between}
}

/* Type */
h1{font-size:32px;line-height:1.2;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.3;font-weight:650;margin:34px 0 10px}
h3{font-size:17px;line-height:1.35;font-weight:650;margin:22px 0 6px}
p{margin:0 0 12px;max-width:72ch}
.lead{font-size:18px;color:var(--muted);max-width:66ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
ol.steps-list{padding-left:22px;max-width:70ch}
ol.steps-list li{margin:6px 0;padding-left:4px}
ul.plain{padding-left:20px;max-width:70ch}
ul.plain li{margin:5px 0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:32px;align-items:center;margin-bottom:8px}
.hero h1{font-size:40px;max-width:16ch}
@media (max-width:1000px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}

/* Buttons and form controls */
.btn{font:inherit;font-size:15px;line-height:1.2;padding:9px 15px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 50%, transparent)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],select,textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
.field{margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--tb)}

/* Lab steps */
.steps{display:flex;border-bottom:1px solid var(--line);margin:22px 0 24px;overflow-x:auto}
.steps button{border:0;background:none;padding:10px 16px 11px;font:inherit;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.steps button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.steps .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;margin-right:8px;font-weight:600}
.steps button[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Board (the drawing surface) */
.board{background-color:var(--board);background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:24px 24px;border:1px solid var(--line-strong);border-radius:10px;padding:10px;overflow-x:auto}
.board svg{display:block;width:100%;min-width:560px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:10px}
.legend svg{vertical-align:middle;margin-right:6px}
.dfd text{font-family:var(--hand)}
.dfd .shape{fill:var(--surface);stroke:var(--ink);stroke-width:1.7}
.dfd .bg{fill:var(--surface)}
.dfd .lbl{font-size:16px;fill:var(--ink);text-anchor:middle}
.dfd .tb rect{fill:none;stroke:var(--tb);stroke-width:1.6;stroke-dasharray:8 6}
.dfd .tb text{fill:var(--tb);font-size:15px}
.dfd .flow .ln{fill:none;stroke:var(--ink);stroke-width:1.5}
.dfd .flow .hit{fill:none;stroke:transparent;stroke-width:20}
.dfd .pill rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1}
.dfd .pill text{font-family:var(--font);font-size:12px;fill:var(--ink);text-anchor:middle}
.dfd .clickable{cursor:pointer}
.dfd .clickable:hover .shape,.dfd .clickable:hover .pill rect{stroke:var(--accent)}
.dfd .clickable:focus{outline:none}
.dfd .clickable:focus-visible .shape,.dfd .clickable:focus-visible .pill rect{stroke:var(--accent);stroke-width:3}
.dfd .sel .shape{stroke:var(--accent);stroke-width:3.2}
.dfd .sel .pill rect{stroke:var(--accent);stroke-width:2.2}
.dfd .sel .ln{stroke:var(--accent);stroke-width:2.4}
.dfd .flow.on .ln{stroke:var(--tb);stroke-width:2.6}
.dfd .flow.on .pill rect{stroke:var(--tb);stroke-width:1.6;fill:color-mix(in srgb, var(--tb) 10%, var(--surface))}
.dfd .flow.ok .ln{stroke:var(--good);stroke-width:2.4}
.dfd .flow.ok .pill rect{stroke:var(--good);stroke-width:1.6}
.dfd .flow.no .ln{stroke:var(--bad);stroke-width:2.4;stroke-dasharray:5 4}
.dfd .flow.no .pill rect{stroke:var(--bad);stroke-width:1.6}
.dfd .badge circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.dfd .badge text{font-family:var(--font);font-size:11px;font-weight:700;text-anchor:middle;fill:var(--muted)}
.dfd .badge.done circle{fill:var(--good);stroke:var(--good)}
.dfd .badge.done text{fill:var(--surface)}

/* Layouts */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
.work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:24px;align-items:start}
.work .stick{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 76px)}
@media (max-width:1100px){.two,.work{grid-template-columns:1fr}.work .stick{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel h2{margin-top:0}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px;max-width:72ch;margin:0 0 16px}
.note.warn{border-color:var(--warn);background:color-mix(in srgb, var(--warn) 10%, transparent)}

/* STRIDE tags and buttons */
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);white-space:nowrap}
.cS{--c:var(--s)}.cT{--c:var(--t)}.cR{--c:var(--r)}.cI{--c:var(--i)}.cD{--c:var(--d)}.cE{--c:var(--e)}.cN{--c:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:4px 0 6px}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:700;font-size:13px;color:var(--c);border:1.5px solid var(--c)}
.chip.off{opacity:.28;border-style:dashed}
.cand{border-top:1px solid var(--line);padding:16px 0 14px}
.cand:first-of-type{border-top:0}
.ctext{font-size:15.5px;margin-bottom:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font:inherit;font-size:14px;font-weight:700;min-width:38px;height:34px;padding:0 10px;border-radius:7px;border:1.5px solid color-mix(in srgb, var(--c) 55%, transparent);background:transparent;color:var(--c);cursor:pointer}
.cat:hover{background:color-mix(in srgb, var(--c) 12%, transparent)}
.cat[aria-pressed="true"]{background:var(--c);color:var(--surface);border-color:var(--c)}
.cat.none{font-weight:600;font-size:13.5px}
.picked{font-size:13.5px;color:var(--muted);margin:6px 0 0;min-height:1.2em}
.hint{font-size:14px;color:var(--warn);margin:8px 0 0}
fieldset.mit{border:0;padding:0;margin:12px 0 0;min-width:0}
.mit legend{font-size:13.5px;font-weight:600;padding:0;margin-bottom:2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;line-height:1.45;cursor:pointer}
.opt input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--accent)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.progress span{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:16px}
.toolbar .small{white-space:nowrap}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.targets button{font:inherit;font-size:14px;padding:6px 10px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.targets button.done{border-color:var(--good);color:var(--good)}

/* Tables */
.scroll{overflow-x:auto;margin:6px 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:13px}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Results */
.scorebox{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;margin:4px 0 18px}
.score{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score span{font-size:24px;color:var(--muted);font-weight:500;margin-left:6px}
.verdict{font-size:18px;max-width:46ch}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv .st{font-size:13px;font-weight:700}
.st.correct,.st.rejected{color:var(--good)}
.st.wrongcat{color:var(--warn)}
.st.missed,.st.fp{color:var(--bad)}
.st.skipped{color:var(--muted)}
.rv p{margin:4px 0;font-size:15px}
.copyarea{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12.5px;min-height:140px}
.empty{color:var(--muted);padding:26px 0;text-align:center}
footer.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><b>DVTM</b><span>Damn Vulnerable Threat Model</span></a>
  <div class="level" id="level"></div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Labs"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<script>
// T(id, text, answer, hint, explanation, mitigations [correct first], alsoAccepted)
const T = (id, text, a, hint, why, mits, alt) => ({ id, text, a, hint, why, mits: mits || [], alt: alt || "" });

const SCEN = [
{
  id: "shop", title: "ShopSmart online store", diff: "Beginner",
  summary: "A small online shop. Customers sign in, fill a basket and pay through a payment gateway; staff manage orders from an admin panel.",
  brief: [
    "ShopSmart is a small online store. Customers sign up with an email and password, fill a basket and pay through a third-party payment gateway. After payment, the gateway calls back to the shop to confirm the order.",
    "Shop staff manage orders and refunds through an admin panel on the same web app. Sessions are kept in a cache server, the app writes events to a log file, and orders and accounts live in a MySQL database on a separate server."
  ],
  assets: ["Customer accounts and password hashes", "Names, addresses and order history", "The integrity of prices, payments and refunds", "Admin access to the shop"],
  vb: [840, 470],
  boundaries: [
    { name: "Shop servers", x: 250, y: 30, w: 345, h: 415 },
    { name: "Database server", x: 625, y: 255, w: 200, h: 190 }
  ],
  elements: [
    { id: "cust", type: "entity", name: "Customer", x: 115, y: 130 },
    { id: "staff", type: "entity", name: "Shop staff", x: 115, y: 345 },
    { id: "app", type: "process", name: "Web shop\napp", x: 410, y: 215, r: 54 },
    { id: "cache", type: "store", name: "Session cache", x: 340, y: 392 },
    { id: "logs", type: "store", name: "App logs", x: 505, y: 392 },
    { id: "db", type: "store", name: "Orders DB", x: 725, y: 350 },
    { id: "pay", type: "entity", name: "Payment\ngateway", x: 725, y: 110 }
  ],
  flows: [
    { id: "f_login", from: "cust", to: "app", label: "Login, checkout", crosses: true, t: 0.62 },
    { id: "f_admin", from: "staff", to: "app", label: "Admin panel", crosses: true, t: 0.6 },
    { id: "f_sess", from: "app", to: "cache", label: "Sessions", crosses: false },
    { id: "f_log", from: "app", to: "logs", label: "Log events", crosses: false },
    { id: "f_sql", from: "app", to: "db", label: "SQL queries", crosses: true, t: 0.32 },
    { id: "f_payreq", from: "app", to: "pay", label: "Payment request", crosses: true, bend: -46, t: 0.3 },
    { id: "f_paycb", from: "pay", to: "app", label: "Payment callback", crosses: true, bend: -46, t: 0.72 }
  ],
  threats: {
    cust: [
      T("s1", "An attacker logs in as a customer using passwords leaked from another website (credential stuffing).", "S", "Someone is pretending to be a real customer.", "Pretending to be a legitimate user is spoofing. It targets the customer’s identity, an external entity.", ["Offer MFA, rate-limit logins and block known breached passwords", "Encrypt the orders database", "Add a CAPTCHA to the product search"]),
      T("s2", "A customer says they never placed an order that was delivered to their address.", "R", "The customer is denying an action.", "Denying an action when the system can’t prove otherwise is repudiation.", ["Log order actions with user ID, time and IP, and send confirmation emails", "Disable guest checkout", "Serve the site over HTTPS"]),
      T("s3", "The customer’s browser slows down on pages with many product photos.", "N", "Would an attacker gain anything?", "This is a performance issue, not a security threat. Keep the threat model focused on what attackers can do.")
    ],
    staff: [
      T("s4", "A phishing email steals a staff member’s password, and the attacker uses the admin panel.", "S", "Someone else is acting as the staff member.", "Using stolen credentials to act as staff is spoofing.", ["Require MFA for staff and allow the admin panel only from the office network or VPN", "Increase the session timeout for staff", "Hide the admin link from the menu"]),
      T("s5", "A staff member issues refunds to a friend’s card, and nothing records who did it.", "R", "Could anyone prove who did it?", "Without records of who did what, staff can deny actions. That is repudiation.", ["Keep an audit log of admin actions that staff can’t edit", "Show staff fewer orders per page", "Send refunds by bank transfer only"])
    ],
    app: [
      T("s6", "A customer changes the price in the checkout request and pays ₹1 for a laptop.", "T", "What is being changed that shouldn’t be?", "Changing data the server trusts is tampering. Never trust prices sent by the browser.", ["Look up prices on the server and ignore prices sent by the browser", "Hide the price field with CSS", "Minify the JavaScript"]),
      T("s7", "Error pages show stack traces with database names and file paths.", "I", "What is leaking?", "Leaking internal details is information disclosure, and it helps attackers plan their next step.", ["Show a generic error to users and log the details on the server", "Make the error page match the site design", "Return HTTP 200 for every error"]),
      T("s8", "A customer opens /admin/orders by guessing the URL, and the page loads.", "E", "The customer gets more rights than intended.", "Reaching admin functions as a normal user is elevation of privilege.", ["Check the user’s role on the server for every admin request", "List /admin in robots.txt so search engines skip it", "Rename /admin to a random-looking path"]),
      T("s9", "A bot sends thousands of search requests per second and the shop slows to a halt.", "D", "What stops working?", "Overloading the app so real customers can’t use it is denial of service.", ["Rate-limit requests, cache search results and scale out", "Log every search request", "Add more product categories"]),
      T("s10", "The shop is written in PHP.", "N", "Is this something an attacker does?", "A technology choice is not a threat. Threats describe what can go wrong, not what the system is built with.")
    ],
    cache: [
      T("s11", "Anyone on the shop network can connect to the session cache without a password and read session tokens.", "I", "What could an outsider read?", "Reading session tokens is information disclosure, and it leads straight to account takeover.", ["Require authentication on the cache and accept connections only from the web app", "Keep sessions for a shorter time", "Rename the cache server"]),
      T("s12", "The session cache pretends to be a customer.", "N", "Can a data store act on its own?", "Data stores don’t act, so they can’t spoof anyone. Spoofing applies to people, systems and processes.")
    ],

/* ---------- scoring ---------- */
function judge(c, st) {
  const u = st.ans[c.id];
  if (c.a === "N") return u === "N" ? "rejected" : u ? "fp" : "skipped";
  if (u && u !== "N" && (u === c.a || c.alt.includes(u))) return "correct";
  if (u && u !== "N") return "wrongcat";
  return "missed";
}
function score(sc, st) {
  const r = { total: 0, max: 0, boundOk: 0, boundN: sc.flows.length, correct: 0, wrongcat: 0, missed: 0, fp: 0, rejected: 0, skipped: 0, mitOk: 0, mitN: 0, hints: 0 };
  for (const f of sc.flows) { r.max++; if (!!st.bound[f.id] === f.crosses) { r.boundOk++; r.total++; } }
  for (const c of allCands(sc)) {
    const j = judge(c, st); r[j]++;
    if (c.a === "N") { r.max += 1; if (j === "rejected") r.total += 1; if (j === "fp") r.total -= 1; }
    else {
      r.max += 3; r.mitN++;
      if (j === "correct") r.total += 2; if (j === "wrongcat") r.total += 1;
      if ((j === "correct" || j === "wrongcat") && st.mit[c.id] === 0) { r.total += 1; r.mitOk++; }
    }
  }
  if (DB.level === "medium") { r.hints = Object.values(st.hints).filter(Boolean).length; r.total -= r.hints; }
  r.total = Math.max(0, r.total); r.pct = pct(r.total, r.max);
  return r;
}

    ${line("Trust boundaries marked correctly", `${r.boundOk} of ${r.boundN}`)}
    ${line("Real threats classified correctly", r.correct)}
    ${line("Real threats found, wrong category", r.wrongcat)}
    ${line("Real threats missed", r.missed)}
    ${line("Distractors correctly rejected", r.rejected)}
    ${line("False positives (distractors marked as threats)", r.fp)}
    ${line("Best mitigation chosen", `${r.mitOk} of ${r.mitN}`)}
    ${DB.level === "medium" ? line("Hints used (1 point each)", r.hints) : ""}
  </tbody></table></div>
  <p class="small muted">Scoring: a real threat earns 2 points for the right category, 1 for the wrong one, and 1 more for the best mitigation. Rejecting a distractor earns 1 point; marking it as a threat loses 1.</p>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="tab" data-tab="threat">Edit my answers</button><button class="btn danger" data-act="reset-sc">${UI.armed === "sc-" + sc.id ? "Click again to reset" : "Reset this lab"}</button></div>
  </div><div><div class="board">${renderDFD(sc, { mode: "results", bound: st.bound })}</div><p class="small muted" style="margin-top:8px">Green flows: you marked the boundary correctly. Red dashed flows: you got the boundary wrong.</p></div></div>`;
  h += `<h2>Review</h2>`;
  const label = { correct: "Correct", wrongcat: "Found, wrong category", missed: "Missed", fp: "False positive", rejected: "Correctly rejected", skipped: "Not answered" };
  for (const [id, list] of Object.entries(sc.threats)) {
    h += `<h3>${esc(targetName(sc, id))}</h3>`;
    for (const c of list) {
      const j = judge(c, st), u = st.ans[c.id];
      const alt = c.alt ? c.alt.split("").map(k => CATS[k].name).join(", ") : "";
      h += `<div class="rv"><span class="st ${j}">${label[j]}</span><p>${esc(c.text)}</p><p class="small">Your answer: ${u ? tagHTML(u) : "none"} &nbsp; Answer: ${tagHTML(c.a)}${alt ? ` <span class="muted">(also accepted: ${alt})</span>` : ""}</p><p class="small muted">${esc(c.why)}</p>`;
      if (c.a !== "N") {
        const m = st.mit[c.id];
        const mark = (j === "correct" || j === "wrongcat") ? (m === 0 ? " You chose this one." : m === undefined ? " You didn’t choose a mitigation." : " You chose a weaker option.") : "";
        h += `<p class="small">Best mitigation: ${esc(c.mits[0])}.<span class="muted">${mark}</span></p>`;
      }
      h += `</div>`;
    }
  }
  const reg = allCands(sc).filter(c => c.a !== "N");
  const md = ["| ID | Element | STRIDE | Threat | Mitigation |", "| --- | --- | --- | --- | --- |"]
    .concat(reg.map((c, i) => { const tid = Object.keys(sc.threats).find(k => sc.threats[k].includes(c)); return `| TM-${String(i + 1).padStart(2, "0")} | ${targetName(sc, tid)} | ${CATS[c.a].name} | ${c.text} | ${c.mits[0]} |`; })).join("\n");
  h += `<h2>Threat register</h2><p>The model answer for this system, ready to paste into a wiki, ticket or document.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>ID</th><th>Element</th><th>STRIDE</th><th>Threat</th><th>Mitigation</th></tr></thead><tbody>${reg.map((c, i) => { const tid = Object.keys(sc.threats).find(k => sc.threats[k].includes(c)); return `<tr><td>TM-${String(i + 1).padStart(2, "0")}</td><td>${esc(targetName(sc, tid))}</td><td>${tagHTML(c.a)}</td><td>${esc(c.text)}</td><td>${esc(c.mits[0])}</td></tr>`; }).join("")}</tbody></table></div>
    <div class="row" style="margin:8px 0"><button class="btn" data-act="copy" data-src="md-${sc.id}">Copy as Markdown</button></div>
    <textarea class="copyarea" id="md-${sc.id}" readonly aria-label="Threat register as Markdown">${esc(md)}</textarea>`;
  return h;
}

/* ---------- sandbox ---------- */
function sb() { if (!DB.sandbox) DB.sandbox = { els: [], flows: [], threats: [], n: 1 }; return DB.sandbox; }
function wrapName(n) { if (n.length <= 9 || !n.includes(" ")) return n; const mid = n.length / 2; let best = -1; for (let i = 0; i < n.length; i++) if (n[i] === " " && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i; return n.slice(0, best) + "\n" + n.slice(best + 1); }
function sbScenario() {
  const s = sb(), cols = { entity: [], process: [], store: [] };
  s.els.forEach(e => cols[e.type].push(e));
  const X = { entity: 110, process: 400, store: 690 };
  const H = Math.max(220, Math.max(1, ...Object.values(cols).map(c => c.length)) * 120 + 40);
  const els = [];
  for (const k in cols) cols[k].forEach((e, i, arr) => els.push({ id: e.id, type: e.type, name: wrapName(e.name), x: X[k], y: Math.round(H / arr.length * (i + 0.5)), r: 48 }));
  const pos = Object.fromEntries(els.map(e => [e.id, e]));
  const flows = s.flows.filter(f => pos[f.from] && pos[f.to]).map(f => {
    const rev = s.flows.some(g => g.from === f.to && g.to === f.from);
    const same = pos[f.from].x === pos[f.to].x;
    return { ...f, bend: rev ? 34 : same ? 60 : 0 };
  });
  return { title: "Your system", vb: [800, H], elements: els, flows, boundaries: [] };
}
function sbTargets() { const s = sb(); const n = Object.fromEntries(s.els.map(e => [e.id, e.name])); return [...s.els.map(e => ({ id: e.id, type: e.type, name: e.name })), ...s.flows.map(f => ({ id: f.id, type: "flow", name: `${n[f.from]} → ${n[f.to]} (${f.label})` }))]; }
function riskOf(t) { const v = t.like * t.imp; return v >= 6 ? "High" : v >= 3 ? "Medium" : "Low"; }
function sbGuide(id) {
  const t = sbTargets().find(x => x.id === id);
  if (!t) return { html: `<p class="muted small">Add an element first.</p>`, cats: [] };
  const cats = APPLIES[t.type].split("");
  return { html: `<p class="small muted" style="margin-bottom:6px">${TYPE_NAME[t.type]}: ask these questions</p><ul class="plain small">${cats.map(k => `<li>${tagHTML(k)} ${esc(ASK[k][t.type])}</li>`).join("")}</ul>`, cats };
}
function viewSandbox() {
  const s = sb(), tg = sbTargets(), sel = UI.sbTarget && tg.find(t => t.id === UI.sbTarget) ? UI.sbTarget : (tg[0] && tg[0].id);
  const names = Object.fromEntries(s.els.map(e => [e.id, e.name]));
  const opts = s.els.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join("");
  const guide = sbGuide(sel);
  const threats = [...s.threats].sort((a, b) => b.like * b.imp - a.like * a.imp);
  const lvl = ["", "Low", "Medium", "High"];
  const tname = id => (tg.find(t => t.id === id) || { name: "(deleted)" }).name;
  const md = ["| ID | Target | STRIDE | Threat | Likelihood | Impact | Risk | Mitigation |", "| --- | --- | --- | --- | --- | --- | --- | --- |"].concat(threats.map(t => `| ${t.code} | ${tname(t.target)} | ${CATS[t.cat].name} | ${t.text} | ${lvl[t.like]} | ${lvl[t.imp]} | ${riskOf(t)} | ${t.mit || "To decide"} |`)).join("\n");
  return `<div class="wrap">
  <p class="crumbs"><a href="#home">Home</a></p>
  <h1>Model your own system</h1>
  <p class="lead">Draw a real application as a data flow diagram, work through STRIDE with guiding questions for each element, rate the risks and export a threat register.</p>
  <div class="row" style="margin-bottom:8px"><button class="btn" data-act="sb-example">Load an example</button><button class="btn danger" data-act="sb-clear">${UI.armed === "sb" ? "Click again to clear" : "Clear everything"}</button></div>
  <h2>1. Draw the system</h2>
  <div class="two">
    <div>
      <div class="panel" style="margin-bottom:16px">
        <h3 style="margin-top:0">Add an element</h3>
        <div class="field"><label class="f" for="sb-name">Name</label><input type="text" id="sb-name" placeholder="For example: Web app, Customer, Orders DB" maxlength="40"></div>
        <div class="field"><label class="f" for="sb-type">Type</label><select id="sb-type"><option value="entity">External entity (a user or outside system)</option><option value="process">Process (code you run)</option><option value="store">Data store (database, file, cache, bucket)</option></select></div>
        <button class="btn primary" data-act="sb-add-el">Add element</button>
      </div>
      <div class="panel">
        <h3 style="margin-top:0">Add a data flow</h3>
        ${s.els.length < 2 ? `<p class="muted small">Add at least two elements first.</p>` : `
        <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label class="f" for="sb-from">From</label><select id="sb-from">${opts}</select></div><div class="field" style="flex:1"><label class="f" for="sb-to">To</label><select id="sb-to">${s.els.map((e, i) => `<option value="${e.id}"${i === 1 ? " selected" : ""}>${esc(e.name)}</option>`).join("")}</select></div></div>
        <div class="field"><label class="f" for="sb-label">What data moves</label><input type="text" id="sb-label" placeholder="For example: Login, SQL queries" maxlength="28"></div>
        <label class="check" style="border:0"><input type="checkbox" id="sb-cross"><span>This flow crosses a trust boundary</span></label>
        <button class="btn primary" data-act="sb-add-flow">Add data flow</button>`}
      </div>
    </div>
    <div>
      ${s.els.length ? `<div class="board">${renderDFD(sbScenario(), { mode: "sandbox" })}</div><p class="small muted" style="margin-top:8px">Red flows cross a trust boundary. Columns: entities, processes, data stores.</p>` : `<div class="board"><p class="empty">Your diagram appears here. Add a user, the code that serves them and where data is kept.</p></div>`}
      ${s.els.length ? `<h3>Elements and flows</h3><div class="scroll"><table class="tbl"><tbody>${s.els.map(e => `<tr><td>${esc(e.name)}</td><td class="muted">${TYPE_NAME[e.type]}</td><td class="num"><button class="btn link" data-act="sb-del-el" data-id="${e.id}">Remove</button></td></tr>`).join("")}${s.flows.map(f => `<tr><td>${esc(names[f.from])} → ${esc(names[f.to])}: ${esc(f.label)}</td><td class="muted">${f.crosses ? "Crosses a boundary" : "Data flow"}</td><td class="num"><button class="btn link" data-act="sb-del-flow" data-id="${f.id}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : ""}
    </div>
  </div>
  <h2>2. Find threats with STRIDE</h2>
  ${tg.length ? `<div class="two"><div class="panel">
      <div class="field"><label class="f" for="sb-target">Element or flow</label><select id="sb-target">${tg.map(t => `<option value="${t.id}"${t.id === sel ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</select></div>
      <div id="sb-guide">${guide.html}</div>
      <div class="field"><label class="f" for="sb-cat">STRIDE category</label><select id="sb-cat">${guide.cats.map(k => `<option value="${k}">${k} ${CATS[k].name}</option>`).join("")}</select></div>
      <div class="field"><label class="f" for="sb-text">Threat</label><textarea id="sb-text" placeholder="Describe what an attacker could do, to what, and how." maxlength="300"></textarea></div>
      <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label class="f" for="sb-like">Likelihood</label><select id="sb-like"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select></div><div class="field" style="flex:1"><label class="f" for="sb-imp">Impact</label><select id="sb-imp"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select></div></div>
      <div class="field"><label class="f" for="sb-mit">Mitigation</label><input type="text" id="sb-mit" placeholder="What will you do about it?" maxlength="200"></div>
      <button class="btn primary" data-act="sb-add-threat">Add threat</button>
    </div><div><p>Pick each element and flow in turn and answer its questions. Only the STRIDE categories that usually apply to that element type are offered.</p><p>Risk is likelihood × impact: High when it scores 6 or more, Medium from 3, otherwise Low.</p><p id="sb-msg" class="small" role="status"></p></div></div>` : `<p class="muted">Add elements to your diagram to start finding threats.</p>`}
  <h2>3. Threat register</h2>
  ${threats.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>ID</th><th>Target</th><th>STRIDE</th><th>Threat</th><th>Risk</th><th>Mitigation</th><th></th></tr></thead><tbody>${threats.map(t => `<tr><td>${t.code}</td><td>${esc(tname(t.target))}</td><td>${tagHTML(t.cat)}</td><td>${esc(t.text)}</td><td>${riskOf(t)} <span class="muted small">(${lvl[t.like]} × ${lvl[t.imp]})</span></td><td>${esc(t.mit || "To decide")}</td><td class="num"><button class="btn link" data-act="sb-del-threat" data-id="${t.id}">Remove</button></td></tr>`).join("")}</tbody></table></div>
    <div class="row" style="margin:8px 0"><button class="btn" data-act="copy" data-src="sb-md">Copy as Markdown</button></div><textarea class="copyarea" id="sb-md" readonly aria-label="Your threat register as Markdown">${esc(md)}</textarea>` : `<p class="muted">Threats you add appear here, sorted by risk.</p>`}
  </div>`;
}
function sbExample() {
  DB.sandbox = { n: 20, els: [
    { id: "e1", name: "Reader", type: "entity" }, { id: "e2", name: "Author", type: "entity" },
    { id: "e3", name: "Blog web app", type: "process" }, { id: "e4", name: "Image resizer", type: "process" },
    { id: "e5", name: "Posts DB", type: "store" }, { id: "e6", name: "Image bucket", type: "store" }
  ], flows: [
    { id: "f1", from: "e1", to: "e3", label: "Read posts", crosses: true }, { id: "f2", from: "e2", to: "e3", label: "Write, upload", crosses: true },
    { id: "f3", from: "e3", to: "e5", label: "Queries", crosses: true }, { id: "f4", from: "e3", to: "e4", label: "Images", crosses: false },
    { id: "f5", from: "e4", to: "e6", label: "Store image", crosses: true }
  ], threats: [
    { id: "t1", code: "T-01", target: "e2", cat: "S", text: "An attacker reuses an author’s leaked password and publishes fake posts.", like: 2, imp: 3, mit: "MFA for authors" },
    { id: "t2", code: "T-02", target: "e4", cat: "D", text: "A huge image upload exhausts memory in the resizer.", like: 2, imp: 2, mit: "Limit image size and dimensions" }
  ] };
}

/* ---------- scoreboard ---------- */
function viewScores() {
  const rows = SCEN.map(sc => `<tr><td><a href="#${sc.id}">${esc(sc.title)}</a></td><td>${sc.diff}</td>${Object.keys(LEVELS).map(lv => { const b = DB.best[sc.id + ":" + lv]; return `<td class="num">${b ? `${b.pct}% <span class="muted small">(${b.total}/${b.max})</span>` : "–"}</td>`; }).join("")}</tr>`).join("");
  const n = sb().threats.length;
  return `<div class="wrap"><p class="crumbs"><a href="#home">Home</a></p><h1>My progress</h1>
  <p class="lead">Your best score in each lab at each security level. A score is recorded each time you check a model.</p>
  <div class="scroll"><table class="tbl"><thead><tr><th>Lab</th><th>Difficulty</th><th class="num">Low</th><th class="num">Medium</th><th class="num">High</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p>Your own system: ${n} threat${n === 1 ? "" : "s"} recorded in <a href="#sandbox">Model your own system</a>.</p>
  <p class="small muted">Progress is saved in this browser only. Clearing site data or using another device starts fresh.</p>
  <button class="btn danger" data-act="reset-all">${UI.armed === "all" ? "Click again to reset all progress" : "Reset all progress"}</button></div>`;
}

/* ---------- render & events ---------- */
const view = document.getElementById("view"), side = document.getElementById("side"), lvl = document.getElementById("level");
let route = "home";
function render(focusId) {
  const sc = SC(route);
  side.innerHTML = navHTML(route);
  lvl.innerHTML = levelHTML();
  view.innerHTML = route === "primer" ? viewPrimer() : route === "sandbox" ? viewSandbox() : route === "scores" ? viewScores() : sc ? viewScenario(sc) : viewHome();
  document.title = (sc ? sc.title + " – " : "") + "DVTM: Damn Vulnerable Threat Model";
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
}
function go() {
  const h = (location.hash || "").slice(1);
  route = ["primer", "sandbox", "scores"].includes(h) || SC(h) ? h : "home";
  UI.armed = null; render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);
function rerender() { const id = document.activeElement && document.activeElement.id; render(id); }
function onTarget(id) {
  const sc = SC(route); if (!sc) return; const st = scState(sc.id), tab = UI.tab[sc.id];
  if (tab === "bound") { st.bound[id] = !st.bound[id]; save(); rerender(); return; }
  if (tab === "threat") { UI.sel[sc.id] = id; render("t-" + id); if (window.innerWidth < 1100) { const p = document.getElementById("panel"); if (p) p.scrollIntoView({ block: "start" }); } }
}
view.addEventListener("click", e => {
  const tg = e.target.closest("[data-target]"); if (tg) { onTarget(tg.dataset.target); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, sc = SC(route), st = sc ? scState(sc.id) : null;
  if (a !== "reset-sc" && a !== "reset-all" && a !== "sb-clear") UI.armed = null;
  if (a === "tab") { UI.tab[sc.id] = b.dataset.tab; render("tab-" + b.dataset.tab); document.querySelector(".steps").scrollIntoView({ block: "nearest" }); }
  else if (a === "pick") { UI.sel[sc.id] = b.dataset.id; render(); const p = document.getElementById("panel"); if (p) { if (window.innerWidth < 1100 || p.getBoundingClientRect().top < 0) p.scrollIntoView({ block: "start" }); const f = p.querySelector("h2"); if (f) { f.tabIndex = -1; f.focus({ preventScroll: true }); } } }
  else if (a === "cat") { const t = b.dataset.tid; st.ans[t] = st.ans[t] === b.dataset.cat ? undefined : b.dataset.cat; if (!st.ans[t]) delete st.ans[t]; save(); rerender(); }
  else if (a === "hint") { st.hints[b.dataset.tid] = true; save(); render(); }
  else if (a === "check") { st.checked = true; const r = score(sc, st), k = sc.id + ":" + DB.level, prev = DB.best[k]; if (!prev || r.total > prev.total) DB.best[k] = { total: r.total, max: r.max, pct: r.pct, date: new Date().toISOString().slice(0, 10) }; UI.tab[sc.id] = "results"; save(); render("tab-results"); document.querySelector(".steps").scrollIntoView({ block: "start" }); }
  else if (a === "reset-sc") { if (UI.armed === "sc-" + sc.id) { delete DB.sc[sc.id]; UI.sel[sc.id] = null; UI.tab[sc.id] = "brief"; UI.armed = null; save(); render(); window.scrollTo(0, 0); } else { UI.armed = "sc-" + sc.id; rerender(); } }
  else if (a === "reset-all") { if (UI.armed === "all") { DB = { level: DB.level, sc: {}, best: {}, sandbox: null }; UI.armed = null; save(); render(); } else { UI.armed = "all"; rerender(); } }
  else if (a === "copy") { const ta = document.getElementById(b.dataset.src); const done = ok => { b.textContent = ok ? "Copied" : "Select the text below and copy it"; setTimeout(() => { b.textContent = "Copy as Markdown"; }, 2200); }; try { navigator.clipboard.writeText(ta.value).then(() => done(true), () => { ta.select(); done(false); }); } catch (err) { ta.select(); done(false); } }
  else if (a.startsWith("sb-")) sandboxAct(a, b);
});
view.addEventListener("keydown", e => { const tg = e.target.closest && e.target.closest("[data-target]"); if (tg && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onTarget(tg.dataset.target); } });
view.addEventListener("change", e => {
  const el = e.target, sc = SC(route);
  if (el.dataset.mit) { const st = scState(sc.id); st.mit[el.dataset.mit] = Number(el.value); save(); }
  else if (el.dataset.bound) { const st = scState(sc.id); st.bound[el.dataset.bound] = el.checked; save(); rerender(); }
  else if (el.id === "sb-target") { UI.sbTarget = el.value; const g = sbGuide(el.value); document.getElementById("sb-guide").innerHTML = g.html; document.getElementById("sb-cat").innerHTML = g.cats.map(k => `<option value="${k}">${k} ${CATS[k].name}</option>`).join(""); }
});
document.getElementById("level").addEventListener("click", e => { const b = e.target.closest("[data-level]"); if (!b) return; DB.level = b.dataset.level; save(); render(); const nb = document.querySelector(`[data-level="${DB.level}"]`); if (nb) nb.focus(); });
function sandboxAct(a, b) {
  const s = sb(), val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; }, msg = t => { const m = document.getElementById("sb-msg"); if (m) m.textContent = t; };
  if (a === "sb-add-el") { const name = val("sb-name"); if (!name) { document.getElementById("sb-name").focus(); return; } s.els.push({ id: "e" + s.n++, name, type: val("sb-type") }); save(); render("sb-name"); }
  else if (a === "sb-add-flow") { const from = val("sb-from"), to = val("sb-to"), label = val("sb-label"); if (from === to) { alertIn("sb-to", "Choose two different elements."); return; } if (!label) { document.getElementById("sb-label").focus(); return; } s.flows.push({ id: "f" + s.n++, from, to, label, crosses: document.getElementById("sb-cross").checked }); save(); render("sb-label"); }
  else if (a === "sb-del-el") { const id = b.dataset.id; const fl = s.flows.filter(f => f.from === id || f.to === id).map(f => f.id); s.els = s.els.filter(e => e.id !== id); s.flows = s.flows.filter(f => !fl.includes(f.id)); s.threats = s.threats.filter(t => t.target !== id && !fl.includes(t.target)); save(); render(); }
  else if (a === "sb-del-flow") { const id = b.dataset.id; s.flows = s.flows.filter(f => f.id !== id); s.threats = s.threats.filter(t => t.target !== id); save(); render(); }
  else if (a === "sb-add-threat") { const text = val("sb-text"); if (!text) { document.getElementById("sb-text").focus(); msg("Describe the threat before adding it."); return; } const target = val("sb-target"); UI.sbTarget = target; const num = s.threats.reduce((m, t) => Math.max(m, parseInt(t.code.slice(2), 10) || 0), 0) + 1; s.threats.push({ id: "t" + s.n++, code: "T-" + String(num).padStart(2, "0"), target, cat: val("sb-cat"), text, like: +val("sb-like"), imp: +val("sb-imp"), mit: val("sb-mit") }); save(); render("sb-text"); const m = document.getElementById("sb-msg"); if (m) m.textContent = "Threat added to the register."; }
  else if (a === "sb-del-threat") { s.threats = s.threats.filter(t => t.id !== b.dataset.id); save(); render(); }
  else if (a === "sb-example") { sbExample(); UI.sbTarget = null; save(); render(); }
  else if (a === "sb-clear") { if (UI.armed === "sb") { DB.sandbox = null; UI.armed = null; save(); render(); } else { UI.armed = "sb"; rerender(); } }
}
function alertIn(id, text) { const el = document.getElementById(id); if (el) { el.setCustomValidity(text); el.reportValidity(); setTimeout(() => el.setCustomValidity(""), 2500); } }
go();
</script>
</body></html>
